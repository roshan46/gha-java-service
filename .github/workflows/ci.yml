name: Java CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 8 * * 1'
permissions: {}
concurrency:
  group: java-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: '21.0.12'
      - run: bash scripts/install-maven.sh
      - run: mvn -B -ntp verify
      - run: bash scripts/install-tool.sh trivy
      - run: trivy fs --scanners vuln --severity HIGH,CRITICAL --exit-code 1 .
      - name: Record provenance metadata
        env:
          REVISION: ${{ github.sha }}
        run: printf '%s\n' "$REVISION" > target/source-commit.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: java-build
          path: |
            target/*.jar
            target/source-commit.txt
            target/surefire-reports/
          retention-days: 7
